name: "Build Kotlin App"
description: "Setup Java 21 + Gradle, build and test a Kotlin service"

inputs:
  working-directory:
    description: "Service folder to build (e.g. inventory-service)"
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"
        cache: "gradle"

    - name: Build and test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ./gradlew test jacocoTestReport --no-daemon
