name: "Docker Build and Push"
description: "Build image, optionally push to GHCR"

inputs:
  image-name:
    description: "e.g. proops2026-eshop/api-gateway"
    required: true
  image-tag:
    description: "Commit SHA or version tag"
    required: true
  push:
    description: "true = push to registry, false = build only"
    required: false
    default: "false"
  registry-username:
    required: false
  registry-password:
    required: false
  context:
    description: "Build context — thư mục chứa Dockerfile (e.g. api-gateway)"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}   # ← trỏ đúng thư mục service
        push: ${{ inputs.push }}
        tags: ghcr.io/${{ inputs.image-name }}:${{ inputs.image-tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
