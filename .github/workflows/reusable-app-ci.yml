name: Reusable App CI

on:
  workflow_call:                    # "cổng" để service repo gọi vào
    inputs:
      stack:
        description: "dotnet | kotlin"
        type: string
        required: true
      service-name:
        description: "e.g. api-gateway, inventory-service"
        type: string
        required: true
      image-tag:
        description: "Commit SHA"
        type: string
        required: true
      push-image:
        description: "true khi merge vào main, false khi chỉ open PR"
        type: boolean
        default: false
    secrets:
      REGISTRY_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write             # cần để push lên GHCR

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: ${{ github.sha }}

      # Bước build — chọn composite action tùy stack
      - name: Build .NET service
        if: inputs.stack == 'dotnet'
        uses: tuaans18/proops2026-cicd-platform/.github/actions/build-dotnet@v1
        with:
          working-directory: ${{ inputs.service-name }}

      - name: Build Kotlin service
        if: inputs.stack == 'kotlin'
        uses: tuaans18/proops2026-cicd-platform/.github/actions/build-kotlin@v1
        with:
          working-directory: ${{ inputs.service-name }}

      - name: Docker build and push
        uses: tuaans18/proops2026-cicd-platform/.github/actions/docker-build-push@v1
        with:
          image-name: ${{ github.repository_owner }}/proops2026-eshop/${{ inputs.service-name }}
          image-tag: ${{ inputs.image-tag }}
          push: ${{ inputs.push-image }}
          context: ${{ inputs.service-name }}   # api-gateway/ inventory-service/ etc.
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
